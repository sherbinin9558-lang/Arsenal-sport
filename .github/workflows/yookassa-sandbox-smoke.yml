name: YooKassa sandbox API smoke

on:
  pull_request:
    paths:
      - ".github/workflows/yookassa-sandbox-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yookassa-sandbox-smoke
  cancel-in-progress: false

jobs:
  configuration-status:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report whether sandbox credentials are configured
        env:
          SHOP_ID: ${{ secrets.YOOKASSA_TEST_SHOP_ID }}
          SECRET_KEY: ${{ secrets.YOOKASSA_TEST_SECRET_KEY }}
          RETURN_URL: ${{ secrets.YOOKASSA_TEST_RETURN_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SHOP_ID" && -n "$SECRET_KEY" && -n "$RETURN_URL" ]]; then
            echo "All three YooKassa sandbox secrets are configured."
          else
            echo "::notice::Sandbox smoke was not run because one or more required secrets are absent: YOOKASSA_TEST_SHOP_ID, YOOKASSA_TEST_SECRET_KEY, YOOKASSA_TEST_RETURN_URL. Secret values are never printed."
          fi

  sandbox-api-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && secrets.YOOKASSA_TEST_SHOP_ID != '' && secrets.YOOKASSA_TEST_SECRET_KEY != '' && secrets.YOOKASSA_TEST_RETURN_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create and cancel an uncaptured sandbox payment
        env:
          YOOKASSA_TEST_SHOP_ID: ${{ secrets.YOOKASSA_TEST_SHOP_ID }}
          YOOKASSA_TEST_SECRET_KEY: ${{ secrets.YOOKASSA_TEST_SECRET_KEY }}
          YOOKASSA_TEST_RETURN_URL: ${{ secrets.YOOKASSA_TEST_RETURN_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import uuid
          import requests

          shop = os.environ["YOOKASSA_TEST_SHOP_ID"].strip()
          key = os.environ["YOOKASSA_TEST_SECRET_KEY"].strip()
          return_url = os.environ["YOOKASSA_TEST_RETURN_URL"].strip()
          if not shop or not key or not return_url.startswith("https://"):
              raise SystemExit("Required sandbox configuration is missing or return URL is not HTTPS.")

          base = "https://api.yookassa.ru/v3"
          payment_id = None
          headers = {
              "Idempotence-Key": str(uuid.uuid4()),
              "Content-Type": "application/json",
          }
          payload = {
              "amount": {"value": "1.00", "currency": "RUB"},
              "capture": False,
              "confirmation": {"type": "redirect", "return_url": return_url},
              "description": "ShopPilot AI automated sandbox API smoke test",
              "metadata": {"purpose": "automated_sandbox_smoke", "run_id": os.getenv("GITHUB_RUN_ID", "local")},
          }

          try:
              response = requests.post(
                  f"{base}/payments", auth=(shop, key), headers=headers,
                  json=payload, timeout=20,
              )
              if response.status_code not in (200, 201):
                  print(f"YooKassa sandbox payment creation failed: HTTP {response.status_code}; response body withheld.")
                  raise SystemExit(1)
              data = response.json()
              payment_id = data.get("id")
              if not payment_id:
                  print("YooKassa response did not contain a payment ID.")
                  raise SystemExit(1)
              print(f"Sandbox payment creation succeeded; status={data.get('status', 'unknown')}. No capture requested.")
              if data.get("paid") is True:
                  print("Unexpected paid=true for a non-capturing sandbox smoke payment.")
                  raise SystemExit(1)

              cancel = requests.post(
                  f"{base}/payments/{payment_id}/cancel",
                  auth=(shop, key),
                  headers={"Idempotence-Key": str(uuid.uuid4()), "Content-Type": "application/json"},
                  timeout=20,
              )
              if cancel.status_code not in (200, 201):
                  print(f"Sandbox payment cancellation failed: HTTP {cancel.status_code}; payment was not captured; response body withheld.")
                  raise SystemExit(1)
              final = cancel.json()
              if final.get("status") != "canceled":
                  print(f"Sandbox payment cancellation returned unexpected status={final.get('status', 'unknown')}.")
                  raise SystemExit(1)
              print("YooKassa sandbox API smoke passed: authenticated create, no capture, cancellation confirmed.")
          finally:
              # No payment is captured by this workflow. If the API created a payment
              # but cancellation failed, the log reports that manual sandbox cleanup may be needed.
              pass
          PY
