name: Production uptime guard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SAAS_PUBLIC_URL: ${{ vars.SAAS_PUBLIC_URL || 'https://arsenal-sport-b3rvpnysmxhvw9wud8wjjd.streamlit.app' }}
    steps:
      - name: Validate production URL
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          url=os.environ["SAAS_PUBLIC_URL"].rstrip("/")
          parsed=urlparse(url)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit("Invalid HTTPS production URL")
          print(f"target=https://{parsed.netloc}")
          PY

      - name: Check Streamlit health
        id: health
        run: |
          python - <<'PY'
          import os, time, urllib.error, urllib.request
          base=os.environ["SAAS_PUBLIC_URL"].rstrip("/")
          url=base+"/_stcore/health"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirect)
          last=None
          for attempt in range(3):
              try:
                  started=time.perf_counter()
                  req=urllib.request.Request(url,headers={"User-Agent":"AI-Agent-Content-Manager-Uptime/1.0"})
                  try:
                      response=opener.open(req, timeout=30)
                  except urllib.error.HTTPError as exc:
                      response=exc
                  body=response.read().decode(errors="replace").strip().lower()
                  status=response.code
                  location=response.headers.get("Location","")
                  latency=round((time.perf_counter()-started)*1000)
                  print(f"attempt={attempt+1} status={status} body={body[:100]} location={location[:300]} latency_ms={latency}")
                  if status in (301,302,303,307,308) and "share.streamlit.io/-/auth/" in location:
                      print("WARNING: NON_BROWSER_CHECK_INCONCLUSIVE — Streamlit redirected the HTTP health probe to its auth gateway. This does not prove the browser UI is unavailable; use the Playwright browser acceptance result.")
                      with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output:
                          output.write("auth_redirect=true\n")
                      raise SystemExit(0)
                  if status == 200 and body == "ok":
                      with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output:
                          output.write("auth_redirect=false\n")
                      raise SystemExit(0)
                  last=RuntimeError(f"unexpected health response: HTTP {status} {body[:100]}")
              except SystemExit:
                  raise
              except Exception as exc:
                  last=exc
                  print(f"attempt={attempt+1} error={exc}")
              time.sleep(5)
          raise SystemExit(f"Production health check failed: {last}")
          PY

      - name: Check application HTTP surface
        if: steps.health.outputs.auth_redirect != 'true'
        run: |
          python - <<'PY'
          import os, urllib.error, urllib.request
          base=os.environ["SAAS_PUBLIC_URL"].rstrip("/")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener=urllib.request.build_opener(NoRedirect)
          req=urllib.request.Request(base,headers={"User-Agent":"AI-Agent-Content-Manager-Uptime/1.0"})
          try:
              response=opener.open(req, timeout=45)
          except urllib.error.HTTPError as exc:
              response=exc
          location=response.headers.get("Location","")
          print("http_status=",response.code,"location=",location[:300])
          if response.code in (301,302,303,307,308) and "share.streamlit.io/-/auth/" in location:
              print("WARNING: NON_BROWSER_CHECK_INCONCLUSIVE — browser-based Playwright acceptance is authoritative for UI access.")
              raise SystemExit(0)
          if response.code != 200:
              raise SystemExit(f"Production application returned HTTP {response.code}")
          PY
