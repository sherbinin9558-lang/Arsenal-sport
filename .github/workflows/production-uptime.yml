name: Production uptime guard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SAAS_PUBLIC_URL: ${{ vars.SAAS_PUBLIC_URL || 'https://arsenal-sport-b3rvpnysmxhvw9wud8wjjd.streamlit.app' }}
    steps:
      - name: Validate production URL
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          url=os.environ["SAAS_PUBLIC_URL"].rstrip("/")
          parsed=urlparse(url)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit("Invalid HTTPS production URL")
          print(f"target=https://{parsed.netloc}")
          PY

      - name: Check Streamlit health
        run: |
          python - <<'PY'
          import os, time, urllib.request
          base=os.environ["SAAS_PUBLIC_URL"].rstrip("/")
          url=base+"/_stcore/health"
          last=None
          for attempt in range(3):
              try:
                  started=time.perf_counter()
                  req=urllib.request.Request(url,headers={"User-Agent":"AI-Agent-Content-Manager-Uptime/1.0"})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body=response.read().decode(errors="replace").strip().lower()
                      latency=round((time.perf_counter()-started)*1000)
                      print(f"attempt={attempt+1} status={response.status} body={body[:100]} latency_ms={latency}")
                      if response.status == 200 and (body == "ok" or "<!doctype html" in body or "<html" in body):
                          print("Streamlit endpoint reachable; native health payload may be rewritten by hosting.")
                          last=None
                          break
                      last=RuntimeError(f"unexpected health response: {response.status} {body[:100]}")
              except Exception as exc:
                  last=exc
                  print(f"attempt={attempt+1} error={exc}")
              time.sleep(5)
          if last is not None:
              raise SystemExit(f"Production health check failed: {last}")
          PY

      - name: Check application HTTP surface
        run: |
          python - <<'PY'
          import os, urllib.request
          base=os.environ["SAAS_PUBLIC_URL"].rstrip("/")
          req=urllib.request.Request(base,headers={"User-Agent":"AI-Agent-Content-Manager-Uptime/1.0"})
          with urllib.request.urlopen(req, timeout=45) as response:
              print("http_status=", response.status)
              if response.status != 200:
                  raise SystemExit("Production application returned a non-200 status")
          PY
