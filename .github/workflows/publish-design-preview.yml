name: Publish ShopPilot design preview

on:
  pull_request:
    paths:
      - "design-preview/**"
      - ".github/workflows/publish-design-preview.yml"
  push:
    branches:
      - main
    paths:
      - "design-preview/**"
      - ".github/workflows/publish-design-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs per ref; a PR validation must never cancel a main deployment.
concurrency:
  group: shoppilot-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate preview
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d design-preview ] || [ ! -f design-preview/index.html ]; then
            echo "::error::design-preview/index.html is missing."
            exit 1
          fi
          test -s design-preview/index.html
          grep -qi '<!doctype html' design-preview/index.html
          grep -q 'MAX' design-preview/index.html
          grep -Eqi 'демонстрац|demo data' design-preview/index.html
          if find design-preview -type l -print -quit | grep -q .; then
            echo "::error::Symbolic links are not allowed in the preview artifact."
            exit 1
          fi
          if grep -RInE --include='*.html' --include='*.css' --include='*.js' '(https?://|url\([[:space:]]*['"'"'"]?//|@import[[:space:]]+url\()' design-preview; then
            echo "::error::External resource reference found in shipped preview assets."
            exit 1
          fi

  deploy:
    name: Deploy isolated static preview
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only design preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: design-preview
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
