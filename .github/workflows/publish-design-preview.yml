name: Publish ShopPilot design preview

on:
  pull_request:
    paths:
      - "design-preview/**"
      - ".github/workflows/publish-design-preview.yml"
  push:
    branches:
      - main
    paths:
      - "design-preview/**"
      - ".github/workflows/publish-design-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shoppilot-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify preview entry point
        run: |
          test -s design-preview/index.html
          grep -qi '<!doctype html' design-preview/index.html
          grep -q 'MAX' design-preview/index.html
          grep -q 'Демонстрационные данные' design-preview/index.html
      - name: Verify self-contained assets
        run: |
          if grep -Eqi '(src|href)="https?://' design-preview/index.html; then
            echo "External asset/link reference found; review before publishing."
            exit 1
          fi

  deploy:
    name: Deploy isolated static preview
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only design preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: design-preview
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
