name: Publish ShopPilot design preview

on:
  pull_request:
    paths:
      - "design-preview/**"
      - ".github/workflows/publish-design-preview.yml"
  push:
    branches:
      - main
    paths:
      - "design-preview/**"
      - ".github/workflows/publish-design-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

# PR validation and main deployment use separate concurrency groups.
concurrency:
  group: shoppilot-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate preview
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d design-preview ] || [ ! -f design-preview/index.html ]; then
            echo "::error::design-preview/index.html is missing."
            exit 1
          fi
          test -s design-preview/index.html
          grep -qi '<!doctype html' design-preview/index.html
          grep -q 'MAX' design-preview/index.html
          grep -Eqi 'демонстрац|demo data' design-preview/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("design-preview")
          external = re.compile(
              rb"""https?://|url\s*\(\s*['"]?//|@import\s+['"]?//|(?:src|href)\s*=\s*['"]?//""",
              re.IGNORECASE,
          )
          errors = []
          for path in root.rglob("*"):
              if path.is_symlink():
                  errors.append(f"Symbolic link is not allowed: {path}")
              elif path.is_file():
                  try:
                      data = path.read_bytes()
                  except OSError as exc:
                      errors.append(f"Cannot read {path}: {exc}")
                      continue
                  if external.search(data):
                      errors.append(f"External URL reference found: {path}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              raise SystemExit(1)
          print("Static preview validation: PASS")
          PY

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    name: Deploy isolated static preview
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only design preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: design-preview
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
