name: Isolated PostgreSQL backup and restore rehearsal

on:
  pull_request:
    paths:
      - ".github/workflows/isolated-postgres-restore-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-postgres-restore-rehearsal
  cancel-in-progress: false

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rehearsal_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rehearsal_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Create synthetic source dataset
        shell: bash
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n1)"
          test -n "$PG_CONTAINER" || { echo "::error::Ephemeral PostgreSQL 17 service container not found"; exit 1; }
          for attempt in $(seq 1 30); do
            docker exec "$PG_CONTAINER" pg_isready -U postgres -d rehearsal_source && break
            sleep 2
          done
          docker exec -i "$PG_CONTAINER" psql -U postgres -d rehearsal_source -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA app;
          CREATE TABLE app.tenants (
            id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            slug text NOT NULL UNIQUE,
            plan text NOT NULL CHECK (plan IN ('trial', 'starter', 'pro'))
          );
          CREATE TABLE app.subscriptions (
            id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            tenant_id integer NOT NULL REFERENCES app.tenants(id),
            status text NOT NULL CHECK (status IN ('active', 'refunded', 'inactive'))
          );
          INSERT INTO app.tenants (slug, plan) VALUES
            ('restore-check-a', 'trial'),
            ('restore-check-b', 'pro');
          INSERT INTO app.subscriptions (tenant_id, status) VALUES (1, 'inactive'), (2, 'active');
          SQL

      - name: Dump synthetic database and restore into a separate empty database
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n1)"
          test -n "$PG_CONTAINER" || { echo "::error::Ephemeral PostgreSQL 17 service container not found"; exit 1; }
          docker exec "$PG_CONTAINER" pg_dump -U postgres --format=custom --no-owner --no-acl --dbname=rehearsal_source --file=/tmp/rehearsal.dump
          docker exec "$PG_CONTAINER" test -s /tmp/rehearsal.dump
          docker exec "$PG_CONTAINER" createdb -U postgres rehearsal_restored
          docker exec "$PG_CONTAINER" pg_restore -U postgres --exit-on-error --no-owner --no-acl --dbname=rehearsal_restored /tmp/rehearsal.dump
          echo "Synthetic PostgreSQL 17 dump restored into a separate empty PostgreSQL 17 database."

      - name: Verify restored schema, rows, constraints, and referential integrity
        shell: bash
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n1)"
          test -n "$PG_CONTAINER" || { echo "::error::Ephemeral PostgreSQL 17 service container not found"; exit 1; }
          docker exec -i "$PG_CONTAINER" psql -U postgres -d rehearsal_restored -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            tenant_count integer;
            subscription_count integer;
            active_pro_count integer;
          BEGIN
            SELECT count(*) INTO tenant_count FROM app.tenants;
            SELECT count(*) INTO subscription_count FROM app.subscriptions;
            SELECT count(*) INTO active_pro_count
              FROM app.subscriptions s
              JOIN app.tenants t ON t.id = s.tenant_id
              WHERE t.slug = 'restore-check-b' AND t.plan = 'pro' AND s.status = 'active';
            IF tenant_count <> 2 OR subscription_count <> 2 OR active_pro_count <> 1 THEN
              RAISE EXCEPTION 'Restore verification failed: tenants %, subscriptions %, active_pro %',
                tenant_count, subscription_count, active_pro_count;
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid = 'app.subscriptions'::regclass AND contype = 'f'
            ) THEN
              RAISE EXCEPTION 'Foreign-key constraint missing after restore';
            END IF;
          END $$;
          SELECT 'Isolated PostgreSQL backup/restore rehearsal passed' AS result;
          SQL
          docker exec "$PG_CONTAINER" rm -f /tmp/rehearsal.dump
