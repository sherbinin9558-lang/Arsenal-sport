name: Python syntax check

on:
  push:
    branches: ["main", "real-attribution-v3"]
  pull_request:
    branches: ["main"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m compileall -q .
