name: PostgreSQL billing state-machine integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-billing-state-machine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shopilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: shopilot_test
    steps:
      - uses: actions/checkout@v4
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" && break
            sleep 2
          done
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"
      - name: Create minimal Supabase-compatible schema and real activation behavior
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          do $$ begin create role anon; exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role; exception when duplicate_object then null; end $$;
          create table public.tenants (
            id uuid primary key,
            plan text not null default 'trial',
            status text not null default 'active'
          );
          create table public.subscriptions (
            tenant_id uuid primary key,
            provider text,
            provider_payment_id text,
            status text not null default 'inactive',
            current_period_end timestamptz,
            next_billing_at timestamptz,
            auto_renew boolean not null default false,
            cancel_at_period_end boolean not null default false,
            updated_at timestamptz not null default now()
          );
          create table public.billing_checkout_sessions (
            id uuid primary key default gen_random_uuid(),
            tenant_id uuid not null,
            provider text not null,
            provider_order_id text,
            provider_payment_id text not null,
            plan text not null,
            status text not null default 'created',
            updated_at timestamptz not null default now(),
            unique(provider, provider_payment_id, tenant_id)
          );
          create function public.activate_paid_subscription(
            uuid, text, text, text, text default null
          ) returns void language plpgsql as $$
          begin
            insert into public.subscriptions(
              tenant_id, provider, provider_payment_id, status, current_period_end,
              auto_renew, cancel_at_period_end, updated_at
            ) values ($1, $3, $4, 'active', now() + interval '30 days', false, false, now())
            on conflict (tenant_id) do update set
              provider = excluded.provider,
              provider_payment_id = excluded.provider_payment_id,
              status = 'active',
              current_period_end = excluded.current_period_end,
              next_billing_at = null,
              auto_renew = false,
              cancel_at_period_end = false,
              updated_at = now();
            update public.tenants set plan = $2, status = 'active' where id = $1;
          end;
          $$;
          SQL
      - name: Apply production billing migrations to disposable PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261005010000_billing_webhook_state_machine.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006090000_billing_refund_lifecycle.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261009170000_require_captured_payment_for_activation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261009190000_billing_checkout_amount_validation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261009193000_prevent_reactivation_after_refund.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026090000_yookassa_only_provider.sql
      - name: Verify authorization, captured payment, actual refund revocation, and late events
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            auth_tenant constant uuid := '11111111-1111-4111-8111-111111111111';
            refund_tenant constant uuid := '22222222-2222-4222-8222-222222222222';
            result jsonb;
            current_status text;
            current_plan text;
            current_payment text;
            activation_count integer;
            revoked boolean;
          begin
            if has_function_privilege('anon',
                 'public.process_billing_payment_event(text,text,text,text,uuid,text,text,text)', 'EXECUTE')
               or has_function_privilege('authenticated',
                 'public.process_billing_payment_event(text,text,text,text,uuid,text,text,text)', 'EXECUTE') then
              raise exception 'Untrusted roles must not execute the billing event RPC';
            end if;
            if not has_function_privilege('service_role',
                 'public.process_billing_payment_event(text,text,text,text,uuid,text,text,text)', 'EXECUTE') then
              raise exception 'service_role must execute the billing event RPC';
            end if;

            if (select count(*) from information_schema.columns
                where table_schema = 'public' and table_name = 'billing_checkout_sessions'
                  and column_name in ('expected_amount','expected_currency')) <> 2 then
              raise exception 'Expected amount/currency columns were not installed';
            end if;

            begin
              perform public.process_billing_payment_event('tbank', 'evt-tbank-rejected', 'fake-payment', 'CONFIRMED', auth_tenant, 'pro', null, null);
              raise exception 'T-Bank provider was unexpectedly accepted';
            exception when others then
              if sqlerrm <> 'INVALID_PROVIDER' then raise; end if;
            end;

            insert into public.tenants(id, plan) values (auth_tenant, 'trial'), (refund_tenant, 'trial');
            insert into public.billing_checkout_sessions
              (tenant_id, provider, provider_payment_id, plan, status, expected_amount, expected_currency)
            values
              (auth_tenant, 'yookassa', 'auth-payment', 'pro', 'created', 990.00, 'RUB'),
              (refund_tenant, 'yookassa', 'refund-payment', 'pro', 'created', 990.00, 'RUB');

            result := public.process_billing_payment_event(
              'yookassa', 'evt-authorized', 'auth-payment', 'AUTHORIZED', auth_tenant, 'pro', null, null
            );
            if exists (select 1 from public.subscriptions where tenant_id = auth_tenant) then
              raise exception 'AUTHORIZED unexpectedly created a paid subscription';
            end if;
            select plan into current_plan from public.tenants where id = auth_tenant;
            if current_plan <> 'trial' then
              raise exception 'AUTHORIZED unexpectedly changed tenant plan: %', current_plan;
            end if;

            result := public.process_billing_payment_event(
              'yookassa', 'evt-paid', 'refund-payment', 'CONFIRMED', refund_tenant, 'pro', null, null
            );
            select count(*) into activation_count from public.subscriptions where tenant_id = refund_tenant;
            if activation_count <> 1 then
              raise exception 'CONFIRMED should create one subscription';
            end if;
            select plan into current_plan from public.tenants where id = refund_tenant;
            if current_plan <> 'pro' then
              raise exception 'CONFIRMED should activate the paid plan';
            end if;

            result := public.process_billing_payment_event(
              'yookassa', 'evt-refund', 'refund-payment', 'refunded', refund_tenant, 'pro', null, null
            );
            select status into current_status from public.subscriptions where tenant_id = refund_tenant;
            select plan into current_plan from public.tenants where id = refund_tenant;
            select status into current_status from public.subscriptions where tenant_id = refund_tenant;
            if current_status <> 'refunded' or current_plan <> 'trial' then
              raise exception 'Refund did not revoke access: subscription=%, tenant plan=%', current_status, current_plan;
            end if;
            if coalesce((result->>'access_revoked')::boolean, false) is not true then
              raise exception 'Refund transition did not report access_revoked=true: %', result;
            end if;

            result := public.process_billing_payment_event(
              'yookassa', 'evt-late-success', 'refund-payment', 'succeeded', refund_tenant, 'pro', null, null
            );
            if coalesce((result->>'ignored')::boolean, false) is not true
               or result->>'reason' <> 'checkout_terminal' then
              raise exception 'Late success was not ignored after refund: %', result;
            end if;
            select status into current_status from public.billing_checkout_sessions
             where tenant_id = refund_tenant and provider_payment_id = 'refund-payment';
            select plan into current_plan from public.tenants where id = refund_tenant;
            if current_status <> 'refunded' or current_plan <> 'trial' then
              raise exception 'Late success changed terminal refund state or reactivated access';
            end if;

            -- A late refund from an older payment must not revoke a newer purchase.
            perform public.activate_paid_subscription(refund_tenant, 'pro', 'yookassa', 'new-payment', null);
            revoked := public.deactivate_paid_subscription(refund_tenant, 'yookassa', 'refund-payment', 'refunded');
            select provider_payment_id into current_payment from public.subscriptions where tenant_id = refund_tenant;
            select plan into current_plan from public.tenants where id = refund_tenant;
            if revoked is not false or current_payment <> 'new-payment' or current_plan <> 'pro' then
              raise exception 'Old refund revoked or modified a newer subscription';
            end if;
          end $$;
          select 'PostgreSQL billing state-machine integration passed' as result;
          SQL
