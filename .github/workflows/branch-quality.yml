name: Branch quality gate

on:
  push:
    branches: [main, 'fix/**', 'work/**']
  pull_request:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Compile changed Python modules
        run: python -m py_compile max_operator.py ui/max.py webmcp_tools.py ai_gateway.py scripts/browser_matrix.py
      - name: Run focused quality tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest
          PYTHONPATH=. pytest -q tests/test_max_operator.py tests/test_webmcp_data.py tests/test_core_regression.py tests/test_ai_gateway.py tests/test_billing_error_sanitization.py tests/test_tbank_billing_provider_safety.py
