name: Branch quality gate

on:
  push:
    branches: [main, 'fix/**', 'work/**']
  pull_request:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Compile changed Python modules
        run: |
          python -m py_compile max_operator.py ui/max.py webmcp_tools.py ai_gateway.py scripts/browser_matrix.py
          python -m py_compile billing.py saas_billing.py tbank_webhook.py
      - name: Run focused quality tests
        run: |
          PYTHONPATH=. pytest -q tests/test_max_operator.py tests/test_webmcp_data.py tests/test_core_regression.py tests/test_ai_gateway.py
      - name: Run billing webhook regression tests
        run: |
          PYTHONPATH=. pytest -q tests/test_yookassa_webhook_contract.py tests/test_webhook_security.py tests/test_billing_webhook.py tests/test_payment_lifecycle_fake_provider.py
