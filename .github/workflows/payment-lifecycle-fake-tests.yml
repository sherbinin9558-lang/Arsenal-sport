name: Payment lifecycle fake-provider tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Compile billing modules
        run: python -m py_compile billing.py saas_billing.py tbank_webhook.py
      - name: Run fake-provider lifecycle tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_payment_lifecycle_fake_provider.py tests/test_billing_webhook.py tests/test_webhook_security.py
