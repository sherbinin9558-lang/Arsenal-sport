name: P2/P3 quality gate

on:
  push:
    branches: ["feat/p2-p3-hardening-20261004"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  browser-webmcp:
    runs-on: ubuntu-latest
    env:
      SAAS_PUBLIC_URL: ${{ secrets.SAAS_PUBLIC_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - name: Skip when browser credentials are not configured
        if: ${{ env.SAAS_PUBLIC_URL == '' || env.E2E_EMAIL == '' || env.E2E_PASSWORD == '' }}
        run: echo "NOT_CONFIGURED: browser E2E secrets are absent; no external smoke test was claimed."
      - uses: actions/checkout@v4
        if: ${{ env.SAAS_PUBLIC_URL != '' && env.E2E_EMAIL != '' && env.E2E_PASSWORD != '' }}
      - uses: actions/setup-python@v5
        if: ${{ env.SAAS_PUBLIC_URL != '' && env.E2E_EMAIL != '' && env.E2E_PASSWORD != '' }}
        with:
          python-version: "3.11"
      - run: pip install playwright
        if: ${{ env.SAAS_PUBLIC_URL != '' && env.E2E_EMAIL != '' && env.E2E_PASSWORD != '' }}
      - run: playwright install --with-deps chromium
        if: ${{ env.SAAS_PUBLIC_URL != '' && env.E2E_EMAIL != '' && env.E2E_PASSWORD != '' }}
      - run: python scripts/p2_live_smoke.py
        if: ${{ env.SAAS_PUBLIC_URL != '' && env.E2E_EMAIL != '' && env.E2E_PASSWORD != '' }}
  provider-smoke:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      VK_TOKEN: ${{ secrets.VK_TOKEN }}
    steps:
      - name: Report credential state
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] && [ -z "$VK_TOKEN" ]; then
            echo "NOT_CONFIGURED: Telegram/VK credentials are absent; no external verification was claimed."
          else
            echo "Provider credentials configured; running read-only health checks."
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Run read-only provider health checks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: |
          python - <<'PY'
          from production_ops import telegram_health, vk_health
          import json, sys
          results = [telegram_health(), vk_health()]
          print(json.dumps(results, ensure_ascii=False))
          failed = [x for x in results if x.get("status") == "failed"]
          if failed:
              sys.exit(1)
          if all(x.get("status") == "skipped" for x in results):
              sys.exit(0)
          PY
