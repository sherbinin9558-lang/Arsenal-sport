name: P2/P3 quality gate

on:
  push:
    branches: ["feat/p2-p3-hardening-20261004"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  browser-webmcp:
    if: ${{ secrets.SAAS_PUBLIC_URL != '' && secrets.E2E_EMAIL != '' && secrets.E2E_PASSWORD != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - env:
          SAAS_PUBLIC_URL: ${{ secrets.SAAS_PUBLIC_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: python scripts/p2_live_smoke.py