name: P2/P3 quality gate

on:
  push:
    branches: ["main", "feat/p2-p3-hardening-20261004", "full-audit-repair-20261004", "production-readiness-20261004", "ai-operator-hardening-20261005", "integration/final-20261005", "audit/production-readiness-10of10-20261005"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      live_smoke:
        description: "Run authenticated live browser/WebMCP/provider smoke"
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: pip check
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Dependency vulnerability audit
        run: pip install pip-audit && pip-audit -r requirements.txt --strict

  required-secrets:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Require production live-smoke secrets
        env:
          SAAS_PUBLIC_URL: ${{ secrets.SAAS_PUBLIC_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: |
          missing=0
          for name in SAAS_PUBLIC_URL E2E_EMAIL E2E_PASSWORD TELEGRAM_BOT_TOKEN VK_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

  browser-webmcp:
    needs: required-secrets
    environment: production
    runs-on: ubuntu-latest
    env:
      SAAS_PUBLIC_URL: ${{ secrets.SAAS_PUBLIC_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Run authenticated browser/WebMCP smoke
        run: |
          set -o pipefail
          python scripts/p2_live_smoke.py 2>&1 | tee live-smoke.log
        env:
          LOAD_REQUESTS: "20"
          LOAD_WORKERS: "5"
          SMOKE_STRICT: "1"
          VK_REQUIRED: "1"
      - name: Generate JUnit report
        if: always()
        run: python scripts/p2_smoke_junit.py smoke-report.json smoke-junit.xml
      - name: Upload live-smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-webmcp-smoke-${{ github.run_id }}
          path: |
            smoke-report.json
            smoke-junit.xml
            live-smoke.log
            artifacts/smoke/**
          if-no-files-found: warn

  provider-smoke:
    needs: required-secrets
    environment: production
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      VK_TOKEN: ${{ secrets.VK_TOKEN }}
      VK_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run read-only provider health checks
        run: |
          python - <<'PY'
          from production_ops import telegram_health, vk_health
          import json, sys
          results = [telegram_health(), vk_health()]
          print(json.dumps(results, ensure_ascii=False))
          failed = [x for x in results if x.get("status") == "failed"]
          if failed:
              sys.exit(1)
          if results[0].get("status") != "ok":
              sys.exit(1)
          PY
