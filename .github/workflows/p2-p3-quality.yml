name: P2/P3 quality gate

on:
  push:
    branches: ["main", "feat/p2-p3-hardening-20261004", "full-audit-repair-20261004"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: pip check
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Dependency vulnerability audit
        run: pip install pip-audit && pip-audit -r requirements.txt --strict

  browser-webmcp:
    runs-on: ubuntu-latest
    env:
      SAAS_PUBLIC_URL: ${{ secrets.SAAS_PUBLIC_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright
      - name: Check browser smoke configuration
        id: browser_config
        run: |
          if [ -n "$SAAS_PUBLIC_URL" ] && [ -n "$E2E_EMAIL" ] && [ -n "$E2E_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::Production browser/WebMCP gate is enabled on main but E2E credentials are not configured."
            exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Browser/WebMCP live smoke skipped on non-main ref: E2E credentials are not configured."
          fi
      - if: steps.browser_config.outputs.enabled == 'true'
        run: playwright install --with-deps chromium
      - if: steps.browser_config.outputs.enabled == 'true'
        run: python scripts/p2_live_smoke.py

  provider-smoke:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      VK_TOKEN: ${{ secrets.VK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check provider smoke configuration
        id: provider_config
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::Production provider gate is enabled on main but TELEGRAM_BOT_TOKEN is not configured."
            exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Telegram live smoke skipped on non-main ref: TELEGRAM_BOT_TOKEN is not configured."
          fi
      - name: Run read-only provider health checks
        if: steps.provider_config.outputs.enabled == 'true'
        run: |
          python - <<'PY'
          from production_ops import telegram_health, vk_health
          import json, sys
          results = [telegram_health(), vk_health()]
          print(json.dumps(results, ensure_ascii=False))
          failed = [x for x in results if x.get("status") == "failed"]
          if failed:
              sys.exit(1)
          if results[0].get("status") != "ok":
              sys.exit(1)
          PY
