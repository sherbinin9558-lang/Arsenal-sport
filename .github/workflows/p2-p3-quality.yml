name: P2/P3 quality gate

on:
  push:
    branches: ["main", "feat/p2-p3-hardening-20261004", "full-audit-repair-20261004", "production-readiness-20261004", "ai-operator-hardening-20261005", "integration/final-20261005", "audit/production-readiness-10of10-20261005", "fix/final-10of10-20261006"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      live_smoke:
        description: "Run authenticated live browser/WebMCP/provider smoke"
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Install QA test dependencies
        run: pip install -r requirements-qa.txt
      - run: python -m compileall -q .
      - run: pip check
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Dependency vulnerability audit
        run: pip install pip-audit && pip-audit -r requirements.txt --strict

  production-secrets:
    outputs:
      has_e2e: ${{ steps.capability.outputs.has_e2e }}
    if: github.event_name != 'pull_request'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Report production smoke capability
        id: capability
        env:
          SAAS_PUBLIC_URL: ${{ secrets.SAAS_PUBLIC_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_REQUIRED: ${{ vars.VK_REQUIRED || '0' }}
        run: |
          test -n "${SAAS_PUBLIC_URL:-https://arsenal-sport-b3rvpnysmxhvw9wud8wjjd.streamlit.app}"
          test -n "${TELEGRAM_BOT_TOKEN}"
          if [ -n "${E2E_EMAIL}" ] && [ -n "${E2E_PASSWORD}" ]; then
            echo "has_e2e=true" >> "$GITHUB_OUTPUT"
            echo "Authenticated browser smoke: enabled"
          else
            echo "has_e2e=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Authenticated browser smoke: not configured; responsive public-login smoke remains active."
          fi
          if [ "${VK_REQUIRED}" = "1" ] && [ -z "${VK_TOKEN}" ]; then
            echo "::error::VK_REQUIRED=1 but VK_TOKEN is missing"
            exit 1
          fi

  browser-webmcp:
    needs: production-secrets
    if: github.event_name != 'pull_request' && needs.production-secrets.outputs.has_e2e == 'true'
    environment: production
    runs-on: ubuntu-latest
    env:
      SAAS_PUBLIC_URL: ${{ secrets.SAAS_PUBLIC_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright
      - name: Install Chromium with bounded timeout
        run: timeout 180s playwright install chromium
      - name: Run authenticated browser/WebMCP smoke
        run: |
          set -o pipefail
          python scripts/p2_live_smoke.py 2>&1 | tee live-smoke.log
        env:
          LOAD_REQUESTS: "20"
          LOAD_WORKERS: "5"
          SMOKE_STRICT: "1"
          VK_REQUIRED: ${{ vars.VK_REQUIRED || '0' }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
      - name: Generate JUnit report
        if: always() && hashFiles('smoke-report.json') != ''
        run: python scripts/p2_smoke_junit.py smoke-report.json smoke-junit.xml
      - name: Upload live-smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-webmcp-smoke-${{ github.run_id }}
          path: |
            smoke-report.json
            smoke-junit.xml
            live-smoke.log
            artifacts/smoke/**
          if-no-files-found: warn

  provider-smoke:
    needs: production-secrets
    if: github.event_name != 'pull_request'
    environment: production
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      VK_TOKEN: ${{ secrets.VK_TOKEN }}
      VK_REQUIRED: ${{ vars.VK_REQUIRED || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run billing webhook smoke
        env:
          BILLING_WEBHOOK_URL: ${{ secrets.BILLING_WEBHOOK_URL }}
        run: python scripts/production_webhook_smoke.py

      - name: Run read-only recovery preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/recovery_preflight.py

      - name: Run read-only provider health checks
        run: |
          python - <<'PY'
          from production_ops import telegram_health, vk_health
          import json, sys
          results = [telegram_health(), vk_health()]
          print(json.dumps(results, ensure_ascii=False))
          failed = [x for x in results if x.get("status") == "failed"]
          if failed:
              sys.exit(1)
          if results[0].get("status") != "ok":
              sys.exit(1)
          PY
