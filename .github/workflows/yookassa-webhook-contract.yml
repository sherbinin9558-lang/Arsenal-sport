name: YooKassa webhook contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webhook-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Compile billing webhook modules
        run: python -m py_compile billing.py tbank_webhook.py
      - name: Test authoritative notification handling
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_yookassa_webhook_contract.py tests/test_webhook_security.py
