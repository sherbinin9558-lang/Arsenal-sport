name: production-observability

on:
  push:
    branches: [main, 'work/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observability:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m unittest tests.test_observability -v
      - name: Streamlit health endpoint
        if: ${{ vars.RUN_LIVE_HEALTHCHECK == 'true' }}
        env:
          SAAS_PUBLIC_URL: ${{ vars.SAAS_PUBLIC_URL || secrets.SAAS_PUBLIC_URL || 'https://arsenal-sport-b3rvpnysmxhvw9wud8wjjd.streamlit.app' }}
        run: |
          python - <<'PY'
          import os, time, urllib.request
          base=os.environ['SAAS_PUBLIC_URL'].rstrip('/')
          started=time.perf_counter()
          req=urllib.request.Request(base+'/_stcore/health',headers={'User-Agent':'AI-Agent-Content-Manager-Health/1.0'})
          opener=urllib.request.build_opener(urllib.request.HTTPRedirectHandler())
          try:
              with opener.open(req,timeout=30) as r:
                  body=r.read().decode().strip().lower()
                  assert r.status==200, r.status
                  assert body=='ok', body
          except urllib.error.HTTPError as e:
              raise RuntimeError(f'health endpoint returned HTTP {e.code}; Streamlit Cloud may redirect unauthenticated health probes') from e
          print('healthcheck latency_ms=',round((time.perf_counter()-started)*1000,1))
          # Health alone is insufficient: confirm the homepage is the Streamlit app, not an unrelated embed/page.
          with urllib.request.urlopen(base,timeout=30) as r:
              homepage=r.read(500_000).decode('utf-8','replace').lower()
              assert r.status==200, f'homepage HTTP {r.status}'
              assert 'streamlit' in homepage, 'homepage HTML does not contain Streamlit markers'
              assert 'statuspage.io/embed' not in homepage and 'status embed installed' not in homepage, 'homepage resolves to a Statuspage embed instead of the Streamlit app'
          print('homepage_check=passed')
          PY
