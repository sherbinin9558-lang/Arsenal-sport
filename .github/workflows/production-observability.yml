name: production-observability

on:
  push:
    branches: [main, 'work/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observability:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m unittest tests.test_observability -v
      - name: Streamlit health and homepage
        if: ${{ vars.RUN_LIVE_HEALTHCHECK == 'true' }}
        env:
          SAAS_PUBLIC_URL: ${{ vars.SAAS_PUBLIC_URL || secrets.SAAS_PUBLIC_URL || 'https://arsenal-sport-b3rvpnysmxhvw9wud8wjjd.streamlit.app' }}
        run: |
          python - <<'PY'
          import os, time, urllib.request

          base = os.environ['SAAS_PUBLIC_URL'].rstrip('/')
          headers = {'User-Agent': 'AI-Agent-Content-Manager-Health/1.0'}

          started = time.perf_counter()
          req = urllib.request.Request(base + '/_stcore/health', headers=headers)
          opener = urllib.request.build_opener(urllib.request.HTTPRedirectHandler())
          try:
              with opener.open(req, timeout=30) as response:
                  body = response.read().decode(errors='replace').strip().lower()
                  if response.status != 200 or body != 'ok':
                      raise RuntimeError(f'health endpoint invalid: HTTP {response.status}, body={body[:200]!r}')
          except Exception as exc:
              raise RuntimeError(f'Streamlit health endpoint failed: {type(exc).__name__}: {exc}') from exc
          print('healthcheck latency_ms=', round((time.perf_counter() - started) * 1000, 1))

          # A healthy runtime endpoint does not prove the homepage serves the app.
          # Fail closed if the public homepage redirects or renders the known
          # Statuspage embed instead of a Streamlit app shell.
          homepage_req = urllib.request.Request(base, headers=headers)
          try:
              with opener.open(homepage_req, timeout=30) as response:
                  final_url = response.geturl()
                  homepage = response.read(200000).decode(errors='replace')
                  if response.status != 200:
                      raise RuntimeError(f'homepage returned HTTP {response.status}')
          except Exception as exc:
              raise RuntimeError(f'Production homepage request failed: {type(exc).__name__}: {exc}') from exc

          lowered = homepage.lower()
          if 'share.streamlit.io/-/auth/' in final_url:
              raise RuntimeError('Production homepage redirects to the Streamlit auth gateway; app UI is not publicly reachable.')
          if 'streamlit' not in lowered and 'stapp' not in lowered:
              raise RuntimeError('Production homepage does not contain expected Streamlit app-shell markers.')
          # Streamlit normally embeds its Statuspage widget even when the app is
          # healthy. Its presence in raw HTML is not proof of a Statuspage-only
          # render; the Playwright browser matrix separately requires visible login UI.
          if 'status embed installed correctly' in lowered or 'qjmnz4vd2y07.statuspage.io/embed/frame' in lowered:
              print('diagnostic: Statuspage widget markup present; browser UI acceptance is authoritative.')
          print('homepage shell acceptance=PASS url=', final_url)
          PY
