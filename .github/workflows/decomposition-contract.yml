name: decomposition-contract

on:
  push:
    branches:
      - 'work/decompose-*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_app_data_module.py tests/test_saas_config.py tests/test_saas_admin.py
