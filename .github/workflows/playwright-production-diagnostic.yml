name: Playwright Production Render Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/playwright_diagnose_production.py"
      - ".github/workflows/playwright-production-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-render-diagnostic:
    name: Chromium production render diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONUNBUFFERED: "1"
      DEBUG: "pw:api"
      SAAS_PUBLIC_URL: ${{ vars.SAAS_PUBLIC_URL || 'https://arsenal-sport-b3rvpnysmxhvw9wud8wjjd.streamlit.app' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Run single-browser render diagnostic
        run: python -u scripts/playwright_diagnose_production.py
      - name: Upload diagnostic artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-render-diagnostic
          path: artifacts/playwright-diagnostic/
          if-no-files-found: warn
          retention-days: 14
