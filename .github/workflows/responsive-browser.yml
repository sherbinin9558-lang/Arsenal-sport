name: Responsive browser matrix

on:
  push:
    branches: ["main", "work/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt playwright
      - name: Install Chromium
        run: timeout 180s playwright install chromium
      - name: Resolve and validate browser smoke URL
        id: target
        env:
          SAAS_PUBLIC_URL: ${{ secrets.SAAS_PUBLIC_URL }}
        run: |
          url="${SAAS_PUBLIC_URL:-https://arsenal-sport-b3rvpnysmxhvw9wud8wjjd.streamlit.app}"
          python - <<'PY' "$url"
          import sys
          from urllib.parse import urlparse
          u = urlparse(sys.argv[1])
          if u.scheme != "https" or not u.netloc:
              raise SystemExit("Invalid HTTPS production URL")
          print("Browser smoke target:", u.scheme + "://" + u.netloc)
          PY
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Probe Streamlit health endpoint (diagnostic, non-blocking)
        env:
          SAAS_PUBLIC_URL: ${{ steps.target.outputs.url }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from pathlib import Path
          base=os.environ["SAAS_PUBLIC_URL"].rstrip("/")
          url=base+"/_stcore/health"
          started=time.perf_counter()
          req=urllib.request.Request(url,headers={"User-Agent":"AI-Agent-Content-Manager-Health/1.0"})
          result={"url":url}
          try:
              with urllib.request.urlopen(req,timeout=60) as response:
                  result.update({"status":response.status,"final_url":response.geturl(),"body":response.read().decode(errors="replace")[:500]})
          except urllib.error.HTTPError as exc:
              result.update({"status":exc.code,"location":exc.headers.get("Location"),"body":exc.read().decode(errors="replace")[:500]})
          except Exception as exc:
              result.update({"status":0,"error":f"{type(exc).__name__}: {exc}"})
          result["latency_ms"]=round((time.perf_counter()-started)*1000,1)
          Path("browser-matrix-health.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False))
          if result.get("status") != 200 or str(result.get("body","")).strip().lower() != "ok":
              print("WARNING: Streamlit health endpoint is not healthy; continuing to browser smoke so the actual UI/startup failure is captured.")
          PY
      - name: Run desktop/tablet/mobile smoke
        env:
          SAAS_PUBLIC_URL: ${{ steps.target.outputs.url }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: python scripts/browser_matrix.py
      - name: Upload browser matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-${{ github.run_id }}
          path: |
            browser-matrix-report.json
            artifacts/browser-matrix/**
          if-no-files-found: warn
