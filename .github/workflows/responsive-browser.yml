name: Responsive browser matrix

on:
  push:
    branches: ["main", "work/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt playwright
      - name: Install Chromium
        run: timeout 180s playwright install chromium
      - name: Resolve and validate browser smoke URL
        id: target
        env:
          SAAS_PUBLIC_URL: ${{ secrets.SAAS_PUBLIC_URL }}
        run: |
          url="${SAAS_PUBLIC_URL:-https://arsenal-sport-b3rvpnysmxhvw9wud8wjjd.streamlit.app}"
          python - <<'PY' "$url"
          import sys
          from urllib.parse import urlparse
          u = urlparse(sys.argv[1])
          if u.scheme != "https" or not u.netloc:
              raise SystemExit("Invalid HTTPS production URL")
          print("Browser smoke target:", u.scheme + "://" + u.netloc)
          PY
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Diagnose Streamlit health and redirect behavior
        env:
          SAAS_PUBLIC_URL: ${{ steps.target.outputs.url }}
        run: |
          python - <<'PY'
          import os, requests, time
          base=os.environ["SAAS_PUBLIC_URL"].rstrip("/")
          for suffix in ("/_stcore/health", "/"):
              url=base+suffix
              started=time.perf_counter()
              try:
                  response=requests.get(url, timeout=60, allow_redirects=False, headers={"User-Agent":"AI-Agent-Content-Manager-Health/2.0"})
                  print("probe=", suffix)
                  print("status=", response.status_code)
                  print("location=", response.headers.get("location",""))
                  print("content_type=", response.headers.get("content-type",""))
                  print("server=", response.headers.get("server",""))
                  print("body_prefix=", response.text[:500].replace("\n"," "))
                  print("latency_ms=", round((time.perf_counter()-started)*1000,1))
              except Exception as exc:
                  print("probe=", suffix)
                  print("error=", f"{type(exc).__name__}: {exc}")
          PY
      - name: Run desktop/tablet/mobile smoke
        env:
          SAAS_PUBLIC_URL: ${{ steps.target.outputs.url }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: python scripts/browser_matrix.py
      - name: Upload browser matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-${{ github.run_id }}
          path: |
            browser-matrix-report.json
            artifacts/browser-matrix/**
          if-no-files-found: warn
