name: QA automation

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-contract:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-qa.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-qa.txt
      - name: Run unit and contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -m "not e2e" --cov=saas_core --cov-report=term-missing
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: .coverage
          if-no-files-found: ignore

  browser-e2e:
    name: Optional public-app E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.E2E_BASE_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-qa.txt
          python -m playwright install --with-deps chromium
      - name: Run browser tests
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
        run: pytest -m e2e -v
