name: OWASP ZAP baseline

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target_url:
        description: "Optional public URL override"
        required: false
        type: string

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve target URL
        id: target
        env:
          INPUT_URL: ${{ inputs.target_url }}
          SAAS_PUBLIC_URL: ${{ secrets.SAAS_PUBLIC_URL }}
        run: |
          url="${INPUT_URL:-$SAAS_PUBLIC_URL}"
          if [ -z "$url" ]; then
            echo "::error::SAAS_PUBLIC_URL secret or workflow target_url is required"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-${{ github.run_id }}
          path: |
            report_html.html
            report_md.md
            report_xml.xml
          if-no-files-found: warn
